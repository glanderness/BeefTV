name: Publish container images

# Container images are optional self-hosted artifacts; desktop releases publish via release-desktop.yml.
# Note: tags created inside release-desktop.yml with GITHUB_TOKEN do not emit push events;
# run `gh workflow run publish-images.yml --ref vX.Y.Z` (or push a v* tag directly) when updating GHCR images.
on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beeftv-web
            dockerfile: Dockerfile
          - image: beeftv-backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate build version
        id: build-info
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "VERSION=$version does not match tag $GITHUB_REF_NAME" >&2; exit 1; }
            grep -Fqx "## $version" CHANGELOG.md || { echo "CHANGELOG.md is missing ## $version" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=${version#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && ! "$GITHUB_REF_NAME" =~ [-+] ]]; then
            echo "is_stable_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ steps.build-info.outputs.is_stable_tag == 'true' }}
            type=raw,value=${{ steps.build-info.outputs.image_tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-info.outputs.build_time }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
