name: Quality checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-windows-updaters:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe actual released updater executables
        run: python scripts/audit-windows-updates.py
      - name: Preserve release compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-audit
          path: audit-evidence/
