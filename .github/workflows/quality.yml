name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_extended_matrix:
        description: Run optional cross-platform SQLite and published Windows upgrade drills
        required: false
        default: false
        type: boolean

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Fast repository-wide gates always run; heavy runtime suites run only when their paths change.
# Browser Director E2E lives in director-e2e.yml and runs for web changes or on demand.
jobs:
  gates:
    name: Structure and docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      web: ${{ steps.changes.outputs.web }}
      agent_host: ${{ steps.changes.outputs.agent_host }}
      windows_storage: ${{ steps.changes.outputs.windows_storage }}
      release_scripts: ${{ steps.changes.outputs.release_scripts }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run structure and public documentation gates
        run: |
          node --test scripts/structure-budget.test.mjs
          node scripts/structure-budget.mjs
          sh scripts/audit-public-docs.sh

      - name: Check diff whitespace and detect affected subsystems
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all_true() {
            for key in backend web agent_host windows_storage release_scripts; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
            echo "docker=false" >> "$GITHUB_OUTPUT"
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            all_true
            exit 0
          fi

          changed_files=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${PR_BASE_SHA}...HEAD"
            changed_files="$(git diff --name-only "${PR_BASE_SHA}...HEAD")"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${PUSH_BEFORE_SHA}" HEAD
            changed_files="$(git diff --name-only "${PUSH_BEFORE_SHA}" HEAD)"
          else
            all_true
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          matches() {
            local pattern="$1"
            if [[ -z "$changed_files" ]]; then
              return 1
            fi
            grep -Eq "$pattern" <<< "$changed_files"
          }

          emit() {
            local key="$1" pattern="$2"
            if matches "$pattern"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit backend '^(backend/|agent-host/|plugin-packages/|plugins/|scripts/deadcode|\.github/workflows/quality\.yml$)'
          emit web '^(web/|plugins/deepseek-harness/|plugin-packages/|scripts/(public-release-(export|audit)|audit-public-docs|verify-beeftv-local-release|build-beeftv-release)\.sh$|(backend/)?Dockerfile$|docker-compose.*\.yml$|\.github/workflows/(quality|publish-images)\.yml$)'
          emit agent_host '^(agent-host/|plugins/deepseek-harness/|backend/internal/assistant|scripts/package-agent-host|\.github/workflows/quality\.yml$)'
          emit windows_storage '^(backend/cmd/(desktop|beeftv)/|backend/internal/(desktopstorage|environment|database|diagnostics|supporttrace|assistantdiagnostics)/|scripts/.*windows|\.github/workflows/quality\.yml$)'
          emit release_scripts '^(\.github/workflows/|scripts/|licenses/|VERSION$|CHANGELOG\.md$|NOTICE$|THIRD_PARTY_NOTICES\.md$)'
          emit docker '^((backend/)?Dockerfile$|docker-compose.*\.yml$|\.github/workflows/publish-images\.yml$)'

  release-scripts:
    needs: gates
    if: needs.gates.outputs.release_scripts == 'true'
    name: Release publisher checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test release scripts and notices
        run: |
          node --test scripts/configure-ubuntu-apt.test.mjs
          node --test scripts/distribution-notices.test.mjs
          python3 -m unittest discover -s scripts -p 'test_publish_desktop_r2.py'
          python3 -m unittest discover -s scripts -p 'test_mirror_desktop_cnb.py'
          python3 -m unittest discover -s scripts -p 'test_package_macos_media_source.py'
          python3 -m unittest discover -s scripts -p 'test_package_wasm_sources.py'
          python3 -m unittest discover -s scripts -p 'test_desktop_cos_store.py'
          python3 -m unittest discover -s scripts -p 'test_smoke_desktop_installer.py'
          python3 scripts/smoke-packaged-cli_test.py

  backend:
    needs: gates
    if: needs.gates.outputs.backend == 'true'
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install agent host dependencies for Go integration tests
        working-directory: agent-host
        run: bun install --frozen-lockfile
      - name: Install native media test dependencies
        run: |
          bash ../scripts/configure-ubuntu-apt.sh
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! fc-list ':lang=zh-cn' | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk
            fc-cache -f
          fi
          fc-match ':lang=zh-cn'
          ffmpeg -version
          ffprobe -version
      - name: Build official protocol packages
        run: sh ../plugin-packages/build-packages.sh
      - name: Run Go tests
        run: go test ./...
      - name: Check dead code budget
        run: node ../scripts/deadcode-budget.mjs

  agent-host:
    needs: gates
    if: needs.gates.outputs.agent_host == 'true'
    name: Agent host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install agent host dependencies
        working-directory: agent-host
        run: bun install --frozen-lockfile
      - name: Verify bundled agent-host packaging
        run: bun test scripts/package-agent-host.test.mjs
      - name: Verify real production timing report
        working-directory: agent-host/eval
        run: python3 -m unittest report_production_test.py
      - name: Verify agent-host request efficiency gate
        working-directory: agent-host
        run: |
          bun test studio-digest.test.mjs skill-resource.test.mjs plan-and-skills.test.mjs eval/request-efficiency-gate.test.mjs timeline-tool-schema.test.mjs durable-stream-events.test.mjs
          bun eval/request-efficiency-gate.mjs
      - name: Run DeepSeek Harness plugin tests
        working-directory: plugins/deepseek-harness
        run: bun run test

  web:
    needs: gates
    if: needs.gates.outputs.web == 'true'
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install native media test dependencies
        run: |
          bash ../scripts/configure-ubuntu-apt.sh
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Lint retired Ant Design APIs
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: |
          bunx playwright install --with-deps chromium
          bun run test
      - name: Run DeepSeek Harness plugin browser tests
        working-directory: plugins/deepseek-harness
        run: |
          ln -s ../../web/node_modules node_modules
          bun test client.browser.test.ts
      - name: Preserve environment check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-check-screenshots-${{ github.sha }}
          path: output/environment-check/*.png
          if-no-files-found: warn

  docker:
    needs: gates
    if: needs.gates.outputs.docker == 'true'
    name: Container build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate web and backend Dockerfiles
        run: |
          docker buildx build --file Dockerfile .
          docker buildx build --file backend/Dockerfile .

  windows-storage:
    needs: gates
    if: needs.gates.outputs.windows_storage == 'true'
    name: Windows storage migration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify migration with real Windows file locks
        working-directory: backend
        run: go test ./internal/environment ./internal/desktopstorage -count=1 -v
      - uses: msys2/setup-msys2@v2
        id: storage-msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
      - name: Select supported Windows compiler
        env:
          MSYSTEM_PREFIX: ${{ steps.storage-msys2.outputs.msys2-location }}\ucrt64
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1
      - name: Verify open desktop migration and rollback
        working-directory: backend
        run: go test ./cmd/desktop -run 'TestWindowsOpenDesktopMigratesWithBusyScratch|TestNativeMigration' -count=1 -v
      - name: Verify diagnostic persistence and offline analysis on Windows
        working-directory: backend
        run: |
          go test ./internal/supporttrace ./internal/diagnostics ./internal/assistantdiagnostics -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/beeftv -run '^TestOfflineDiagnostics' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  released-windows-upgrades:
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended_matrix == true
    name: Published Windows upgrade and rollback
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download known final package
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 2 https://github.com/glanderness/BeefTV/releases/download/v1.7.2/BeefTV-v1.7.2-windows-amd64.zip -o candidate.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash candidate.zip -Algorithm SHA256).Hash.ToLower() -ne 'bb2cb4e152c7b2eb1d54adb7553c69d59aef755b242d2cbf0c14e7472a8b4f65') { throw 'Candidate hash mismatch' }
      - name: Real released helpers, backend startup, SQLite and rollback
        run: python scripts/test-windows-published-upgrade.py --archive candidate.zip --version v1.7.2 --output upgrade-evidence/results.json
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: released-windows-upgrade-evidence
          path: upgrade-evidence/

  database-platforms:
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended_matrix == true
    name: SQLite and runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Select runner C compiler on Windows
        if: runner.os == 'Windows'
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Record actual platform and SQLite driver
        run: |
          mkdir -p matrix-evidence
          go version | tee matrix-evidence/platform.txt
          go env GOOS GOARCH CGO_ENABLED CC | tee -a matrix-evidence/platform.txt
          gcc --version | head -1 | tee -a matrix-evidence/platform.txt
          go list -m gorm.io/driver/sqlite github.com/mattn/go-sqlite3 | tee -a matrix-evidence/platform.txt
      - name: Build official protocol packages
        if: runner.os != 'Windows'
        run: sh ../plugin-packages/build-packages.sh
      - name: Build official protocol packages with runner Python on Windows
        if: runner.os == 'Windows'
        run: |
          node ../plugin-packages/embed-documentation.mjs
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('../plugin-packages')
          for manifest in sorted(root.glob('*/manifest.json')):
              package = manifest.parent
              files = []
              for name in ['manifest.json', 'README.md', 'docs', 'assets', 'web', 'backend', 'LICENSE']:
                  source = package / name
                  files.extend([source] if source.is_file() else [item for item in source.rglob('*') if item.is_file()])
              with ZipFile(root / (package.name + '.beeftv-plugin'), 'w', ZIP_DEFLATED) as archive:
                  for source in sorted(files):
                      archive.write(source, source.relative_to(package).as_posix())
          PY
      - name: Historical SQLite, schema repair and interrupted migration
        run: go test ./internal/database -count=1 -json | tee matrix-evidence/database.jsonl
      - name: Native updater replacement, recovery, cleanup and install locks
        run: go test ./internal/desktopupdate -count=1 -json | tee matrix-evidence/desktopupdate.jsonl
      - name: Local provider task persistence and restart matrix
        run: go test ./internal/app -run '^TestDBRuntime' -count=1 -json | tee matrix-evidence/runtime.jsonl
      - name: Actual CLI, MCP startup and native process lifecycle
        run: go test ./cmd/beeftv ./internal/runtimeinfo ./internal/assistantruntime -count=1 -json | tee matrix-evidence/cli-mcp.jsonl
      - name: Preserve per-test results and platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-matrix-${{ runner.os }}-${{ github.sha }}
          path: backend/matrix-evidence/
