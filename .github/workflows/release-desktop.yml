name: Recover v2.0.3 COS feed

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Must be v2.0.3; this job only bridges the original published envelope
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bridge:
    name: Restore the original v2.0.3 COS feed only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the exact authorized recovery
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "glanderness/BeefTV" ]]
          [[ "$GITHUB_REF" == "refs/heads/ops/v203-cos-bridge-recovery" ]]
          [[ "$CONFIRM_VERSION" == "v2.0.3" ]]

      - uses: actions/checkout@v4
        with:
          ref: e13263c948fbbada3724442fc2c9ee6aaea6cfa2

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify the unchanged publisher contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_publish_desktop_r2.py'
          python3 -m unittest discover -s scripts -p 'test_desktop_cos_store.py'

      - name: Build the public-key verifier
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/update-release" ./cmd/update-release

      - name: Retrieve and verify the original published envelope
        env:
          GH_TOKEN: ${{ github.token }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v203-cos-recovery"
          gh release download v2.0.3 --repo glanderness/BeefTV --pattern desktop-update.json --dir "$RUNNER_TEMP/v203-cos-recovery"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == "e13263c948fbbada3724442fc2c9ee6aaea6cfa2"
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "v203-cos-recovery/desktop-update.json"
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "26edee1c17a7cc904afa6ef7893a267ad9c94c9f88bc3f0a3e488dda34328200"
          body = json.loads(base64.b64decode(json.loads(raw)["payload"]))
          assert body["version"] == "v2.0.3"
          assert body["commit"] == "e13263c948fbbada3724442fc2c9ee6aaea6cfa2"
          PY
          "$RUNNER_TEMP/update-release" verify --envelope "$RUNNER_TEMP/v203-cos-recovery/desktop-update.json"

      - name: Bridge only with the existing locks and exact original bytes
        env:
          GH_TOKEN: ${{ github.token }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BEEFTV_COS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEEFTV_COS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/v203-cos-recovery/bridge-trace.log"
          import hashlib, json, os, pathlib, runpy, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          import desktop_cos_store
          original = desktop_cos_store.COSHTTP.request
          state = pathlib.Path(os.environ["RUNNER_TEMP"]) / "v203-cos-recovery/state"
          state.mkdir(parents=True, exist_ok=True)
          def trace(self, method, key, *args, **kwargs):
              print(json.dumps({"event": "request", "method": method, "key": key}), flush=True)
              try:
                  response = original(self, method, key, *args, **kwargs)
              except desktop_cos_store.PublishError as error:
                  cause = error.__context__
                  print(json.dumps({"event": "failure", "method": method, "key": key,
                                    "errorType": type(cause).__name__,
                                    "reasonType": type(getattr(cause, "reason", None)).__name__}), flush=True)
                  raise
              print(json.dumps({"event": "response", "method": method, "key": key,
                                "status": response.status}), flush=True)
              if method == "GET" and response.status == 200 and key.startswith(("beeftv/.publication-locks/", "beeftv/.publication-claims/")):
                  destination = kwargs.get("destination")
                  if destination is not None:
                      raw = pathlib.Path(destination).read_bytes()
                      if len(raw) <= 8192:
                          (state / (hashlib.sha256(key.encode()).hexdigest() + ".json")).write_bytes(raw)
              return response
          desktop_cos_store.COSHTTP.request = trace
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          sys.argv = ["publish-desktop-r2.py", "bridge-cos",
                      "--manifest", str(root / "v203-cos-recovery/desktop-update.json"),
                      "--verifier", str(root / "update-release"),
                      "--provider", "cos",
                      "--endpoint-url", "https://cos.ap-guangzhou.myqcloud.com",
                      "--region", "ap-guangzhou", "--bucket", "beeftv-components-1481187348"]
          runpy.run_path("scripts/publish-desktop-r2.py", run_name="__main__")
          PY

      - name: Preserve exact recovery inputs and safe operation trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v203-cos-recovery-evidence
          path: ${{ runner.temp }}/v203-cos-recovery
          if-no-files-found: warn
          retention-days: 7
